name = "doomsday-ticket-alert"
main = "src/index.js"
compatibility_date = "2026-11-01"

[triggers]
crons = ["* * * * *"]   # every minute

[vars]
NTFY_SERVER = "https://ntfy.sh"

# Create with:  npx wrangler kv namespace create STATE
# then paste the id it prints below.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = true
